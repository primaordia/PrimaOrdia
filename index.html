<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Prima Ordia Prototype</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="pre-intro-active intro-active">
    <section class="pre-intro-screen" id="preIntroScreen" aria-label="Begin Prima Ordia">
      <button id="preIntroBtn" class="pre-intro-btn" type="button">Click Here</button>
    </section>

    <section class="intro-screen" id="introScreen" aria-label="Prima Ordia introduction">
      <button id="startGameBtn" class="start-game-btn" type="button">Start Game</button>
    </section>

    <main class="game-shell">
      <section class="topbar" aria-label="Game status">
        <div>
          <h1>Prima Ordia</h1>
        </div>
        <div class="resources">
          <span id="gold">Gold 0</span>
          <span id="wave">Mission 1</span>
        </div>
      </section>

      <section class="scene" aria-label="3D battlefield">
        <canvas id="battlefield" aria-label="3D real-time strategy battlefield"></canvas>
      </section>

      <div class="countdown-overlay" id="countdownOverlay" aria-live="polite"></div>
      <p class="log" id="log">Select a hero. Tap ground to move, tap enemies to focus fire.</p>

      <section class="hud" aria-label="Battle controls">
        <div class="hero-dock" id="heroDock" aria-label="Hero quick select"></div>
        <div class="squad" id="squad"></div>
        <div class="action-panel">
          <div>
            <p class="eyebrow">Selected</p>
            <h2 id="selectedName">Choose a hero</h2>
            <div class="ability-row">
              <div class="abilities-panel" id="abilitiesPanel" aria-label="Hero abilities"></div>
              <div class="actions action-menu">
                <button id="menuBtn" class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="actionMenu">
                  <span></span>
                  <span></span>
                  <span></span>
                </button>
                <div class="action-menu__items" id="actionMenu">
                  <button id="introBtn" type="button">Intro</button>
                  <button id="soundBtn" type="button">Sound On</button>
                  <button id="musicBtn" type="button">Music On</button>
                  <button id="rallyBtn" type="button">Rally</button>
                  <button id="restartBtn" type="button">Restart</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <p id="selectedStats" class="selected-stats">Tap a hero, then tap the field to move.</p>
      </section>
    </main>

    <script type="module" src="game.js"></script>
  </body>
</html>
